name: Setup pinned root implementation
description: Clone exactly one supported root implementation at a verified commit
inputs:
  flavor:
    description: "kernelsu, next, bakasu, finasu, sukisu-ultra, or kowsu"
    required: true
  commit:
    description: 'Full immutable commit SHA'
    required: true

runs:
  using: composite
  steps:
    - name: Clone and integrate selected root
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        set -euo pipefail

        flavor="${{ inputs.flavor }}"
        expected_commit="${{ inputs.commit }}"
        case "$flavor" in
          kernelsu)
            repo="https://github.com/tiann/KernelSU.git"
            directory="KernelSU"
            manager="KernelSU Manager"
            ;;
          next)
            repo="https://github.com/KernelSU-Next/KernelSU-Next.git"
            directory="KernelSU-Next"
            manager="KernelSU Next Manager"
            ;;
          bakasu)
            repo="https://github.com/Baka-SU/BakaSU.git"
            directory="BakaSU"
            manager="BakaSU Manager"
            ;;
          sukisu-ultra)
            repo="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"
            directory="SukiSU-Ultra"
            manager="SukiSU-Ultra Manager"
            ;;
          kowsu)
            repo="https://github.com/KOWX712/KernelSU.git"
            directory="KowSU"
            manager="KowSU Manager"
            ;;
          finasu)
            repo="https://github.com/LyraVoid/FinaSU.git"
            directory="FinaSU"
            manager="FinaSU Manager"
            ;;
          *)
            echo "Unsupported root flavor: $flavor" >&2
            exit 2
            ;;
        esac

        if ! [[ "$expected_commit" =~ ^[0-9a-f]{40}$ ]]; then
          echo "Root commit must be a full 40-character SHA." >&2
          exit 2
        fi

        for candidate in KernelSU KernelSU-Next BakaSU FinaSU SukiSU-Ultra KowSU; do
          if [ "$candidate" != "$directory" ] && [ -e "$candidate" ]; then
            echo "Refusing mixed root implementations: found $candidate." >&2
            exit 1
          fi
        done

        if [ -d common/drivers ]; then
          drivers_dir="common/drivers"
        elif [ -d drivers ]; then
          drivers_dir="drivers"
        else
          echo "Kernel drivers directory not found." >&2
          exit 1
        fi

        if [ -e "$drivers_dir/kernelsu" ] || [ -L "$drivers_dir/kernelsu" ]; then
          echo "Refusing to replace an existing kernelsu integration." >&2
          exit 1
        fi
        if [ -e "$directory" ]; then
          echo "Refusing to reuse an existing root checkout: $directory." >&2
          exit 1
        fi

        git clone --no-checkout "$repo" "$directory"
        git -C "$directory" fetch --depth=1 origin "$expected_commit"
        git -C "$directory" checkout --detach "$expected_commit"
        actual_commit="$(git -C "$directory" rev-parse HEAD)"
        if [ "$actual_commit" != "$expected_commit" ]; then
          echo "Root commit mismatch: expected $expected_commit, got $actual_commit." >&2
          exit 1
        fi
        if [ ! -f "$directory/kernel/Kconfig" ] || [ ! -f "$directory/kernel/Makefile" ]; then
          echo "Selected root checkout does not contain a kernel integration." >&2
          exit 1
        fi
        root_version="$(git -C "$directory" describe --tags --always --dirty)"

        relative_kernel="$(realpath --relative-to="$drivers_dir" "$PWD/$directory/kernel")"
        ln -s "$relative_kernel" "$drivers_dir/kernelsu"
        grep -q 'obj-$(CONFIG_KSU) += kernelsu/' "$drivers_dir/Makefile" ||
          printf '\nobj-$(CONFIG_KSU) += kernelsu/\n' >> "$drivers_dir/Makefile"
        grep -q 'source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig" ||
          sed -i '/endmenu/i source "drivers/kernelsu/Kconfig"' "$drivers_dir/Kconfig"

        echo "ROOT_IMPLEMENTATION=$flavor" >> "$GITHUB_ENV"
        echo "ROOT_MANAGER=$manager" >> "$GITHUB_ENV"
        echo "ROOT_VERSION=$root_version" >> "$GITHUB_ENV"
        echo "ROOT_COMMIT=$actual_commit" >> "$GITHUB_ENV"

    - name: Enable root configuration
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU=y

    - name: Soften KernelSU-Next Kbuild config guard for mrproper
      if: inputs.flavor == 'next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Upstream Next's drivers/kernelsu/Kbuild hard-errors at parse time
        # when neither CONFIG_KPROBES nor CONFIG_KSU_SUSFS is set. During
        # build.sh's mrproper phase no .config exists yet, so the clean step
        # dies before defconfig ever sets CONFIG_KSU_SUSFS=y. Demote to a
        # warning: the message stays visible, and the real build still gets
        # CONFIG_KSU_SUSFS=y via defconfig. No-op if upstream drops the guard.
        for d in common/drivers/kernelsu drivers/kernelsu; do
          if [ -f "$d/Kbuild" ] && grep -q 'KernelSU requires either CONFIG_KPROBES' "$d/Kbuild"; then
            sed -i 's/$(error "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/$(warning "KernelSU requires either CONFIG_KPROBES=y or CONFIG_KSU_SUSFS=y")/' "$d/Kbuild"
            echo "Softened KSU config guard in $d/Kbuild"
          fi
        done

    - name: Gate KernelSU-Next throne hunt behind the boot crown
      if: inputs.flavor == 'next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        # The packages.list fsnotify observer is the ONLY reliable crown
        # trigger: the early track_throne in core/init.c runs before
        # /data/app exists, so removing the observer (v1 of this patch)
        # left the kernel without a manager uid and the manager reported
        # "Not installed". Keep the observer, but once the manager is
        # crowned this boot, packages.list rewrites must not rescan
        # /data/app anymore: that kernel-side directory walk is an
        # inotify-detectable root fingerprint (throne-hunt class
        # detectors trigger rewrites at app runtime, long after the
        # boot crown). A manager reinstall invalidates the uid and
        # naturally re-arms the gate for the next rewrite.
        python3 - <<'PY'
        import io
        p = "kernel/manager/pkg_observer.c"
        s = io.open(p, encoding="utf-8").read()
        inc = '#include "manager/throne_tracker.h"'
        assert inc in s, "pkg_observer: throne_tracker include not found"
        if '#include "manager/manager_identity.h"' not in s:
            s = s.replace(inc, inc + '\n#include "manager/manager_identity.h"', 1)
        sig = ("static int ksu_handle_inode_event(struct fsnotify_mark *mark, u32 mask,\n"
               "                                  struct inode *inode, struct inode *dir,\n"
               "                                  const struct qstr *file_name, u32 cookie)\n{")
        assert sig in s, "pkg_observer: inode_event signature not found"
        gate = ("\n\t/* dc: crown-gated throne hunt. Before the crown this observer is\n"
                "\t * the only reliable trigger (early init scan runs before /data/app\n"
                "\t * exists); after it, packages.list rewrites triggered at app runtime\n"
                "\t * (throne-hunt detectors) must not rescan /data/app. */\n"
                "\tif (ksu_is_manager_appid_valid())\n"
                "\t\treturn 0;")
        assert "dc: crown-gated" not in s
        s = s.replace(sig, sig + gate, 1)
        io.open(p, "w", encoding="utf-8", newline="\n").write(s)
        print("pkg_observer: crown-gated (throne hunt off after crown)")
        PY

    - name: Time-cohere selinux_hide context rejects (next)
      if: inputs.flavor == 'next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        # my_write_context() answers /proc/self/attr/current writes against
        # the backup policy (that is what keeps the KSU-specific context
        # oracle rejected for apps). A structurally valid but unknown-type
        # context pays the full backup parse, while a leading-newline
        # context fails before any policy work - so the invalid-type vs
        # newline-prefix pair turns the oracle into a timing side channel
        # (Duck 2026.10.25 "App Zygote attr/current timing": paired median
        # positive at ~90% A-slower pairs). Give the definitely-invalid
        # class the same full-cost backup parse through a canonical probe
        # context (type that does not exist in the backup policy), then
        # return EINVAL exactly like stock does. The probe is declared
        # longer than typical probe contexts so the residual direction
        # drifts negative, which the detector treats as baseline.
        python3 - <<'PY'
        import io
        p = "kernel/feature/selinux_hide.c"
        s = io.open(p, encoding="utf-8").read()
        marker = "dc: timing-coherent"
        assert marker not in s, "selinux_hide: timing-coherent gate already applied"
        anchor = (
            "    length =\n"
            "        ksu_avc_has_perm_compat(current_sid(), SECINITSID_SECURITY, SECCLASS_SECURITY, SECURITY__CHECK_CONTEXT, NULL);\n"
            "    if (length)\n"
            "        goto out;\n"
            "    length = __security_context_to_sid_with_policy(backup_sepolicy, buf, size, &sid, SECSID_NULL, GFP_KERNEL, NULL, NULL);\n"
        )
        assert anchor in s, "selinux_hide: my_write_context anchor not found"
        gate = (
            "    length =\n"
            "        ksu_avc_has_perm_compat(current_sid(), SECINITSID_SECURITY, SECCLASS_SECURITY, SECURITY__CHECK_CONTEXT, NULL);\n"
            "    if (length)\n"
            "        goto out;\n"
            "    /* dc: timing-coherent reject (Duck 2026.10.25 \"App Zygote\n"
            "     * attr/current timing\"). Stock fails a leading-garbage context\n"
            "     * before any policy work, so the invalid-type vs newline-prefix\n"
            "     * pair turns the backup-policy parse into a timing side channel.\n"
            "     * Give the definitely-invalid class the same full-cost backup\n"
            "     * parse through a canonical probe context, then return EINVAL\n"
            "     * exactly like stock does. The probe type does not exist in the\n"
            "     * backup policy, so the oracle verdict is unchanged. */\n"
            "    if (size && (buf[0] == '\\n' || buf[0] == '\\r' || buf[0] == ' ' ||\n"
            "                 buf[0] == '\\t' || buf[0] == ':' || buf[0] == ';')) {\n"
            "        static const char dc_probe_ctx[] =\n"
            "            \"u:r:dc_probe_sentinel_long_oracle_context_t:s0\";\n"
            "        u32 dc_sid;\n"
            "\n"
            "        __security_context_to_sid_with_policy(backup_sepolicy, dc_probe_ctx,\n"
            "            (u32)(sizeof(dc_probe_ctx) - 1), &dc_sid, SECSID_NULL,\n"
            "            GFP_KERNEL, NULL, NULL);\n"
            "        return -EINVAL;\n"
            "    }\n"
            "    length = __security_context_to_sid_with_policy(backup_sepolicy, buf, size, &sid, SECSID_NULL, GFP_KERNEL, NULL, NULL);\n"
        )
        s = s.replace(anchor, gate, 1)
        io.open(p, "w", encoding="utf-8", newline="\n").write(s)
        print("selinux_hide: timing-coherent reject installed")
        PY
    - name: Time-cohere my_setprocattr newline rejects (next)
      if: inputs.flavor == 'next'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
      run: |
        # The /proc/self/attr/current carrier is my_setprocattr(), not
        # my_write_context(): the newline-prefix class skips the backup
        # parse entirely (stock-shaped early reject), while the
        # invalid-type class pays the full dual-policy parse - that pair
        # is Duck 2026.10.25 "App Zygote attr/current timing". Burn the
        # same full-cost backup parse for the newline class via a
        # canonical probe context before the stock deny path, keeping
        # the EINVAL verdict and the oracle semantics unchanged.
        python3 - <<'PY'
        import io
        p = "kernel/feature/selinux_hide.c"
        s = io.open(p, encoding="utf-8").read()
        marker = "dc: timing-coherent newline"
        assert marker not in s, "selinux_hide: newline gate already applied"
        anchor = (
            "    /* Obtain a SID for the context, if one was specified. */\n"
            "    if (size && str[0] && str[0] != '\\n') {\n"
        )
        assert anchor in s, "selinux_hide: my_setprocattr anchor not found"
        gate = (
            "    /* dc: timing-coherent newline reject (Duck 2026.10.25 \"App\n"
            "     * Zygote attr/current timing\"). Stock skips the context parse\n"
            "     * for a leading-newline value, so the invalid-type vs\n"
            "     * newline-prefix pair turns the backup-policy parse into a\n"
            "     * timing side channel. Burn the same full-cost backup parse\n"
            "     * through a canonical probe context (type that does not exist\n"
            "     * in the backup policy), then keep the stock deny path with\n"
            "     * sid == 0. The verdict is unchanged, only the cost matches. */\n"
            "    if (size && str[0] == '\\n') {\n"
            "        static const char dc_probe_ctx[] =\n"
            "            \"u:r:dc_probe_sentinel_long_oracle_context_t:s0\";\n"
            "        u32 dc_sid = 0, dc_orig_sid = 0;\n"
            "        int dc_orig_err = 0;\n"
            "\n"
            "        __security_context_to_sid_with_policy(backup_sepolicy, dc_probe_ctx,\n"
            "            (u32)(sizeof(dc_probe_ctx) - 1), &dc_sid, SECSID_NULL,\n"
            "            GFP_KERNEL, &dc_orig_sid, &dc_orig_err);\n"
            "    }\n"
            "    /* Obtain a SID for the context, if one was specified. */\n"
            "    if (size && str[0] && str[0] != '\\n') {\n"
        )
        s = s.replace(anchor, gate, 1)
        io.open(p, "w", encoding="utf-8", newline="\n").write(s)
        print("selinux_hide: timing-coherent newline reject installed")
        PY

    - name: Disable multi-manager for BakaSU
      if: inputs.flavor == 'bakasu'
      uses: ./.github/actions/set-kernel-config
      with:
        config_list: |
          CONFIG_KSU_MULTI_MANAGER_SUPPORT=n
          CONFIG_KSU_TOOLKIT_SUPPORT=y

    - name: Soften BakaSU Kbuild submodule check for bazel builds
      if: inputs.flavor == 'bakasu'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # Fallback: demote the git submodule check from error to warning.
        # Modify the Kbuild in the BakaSU checkout so the change propagates
        # through the symlink into bazel sandbox.
        for d in BakaSU/kernel; do
          if [ -f "$d/Kbuild" ] && grep -q 'You should use \$(REPO_NAME) as a git submodule instead of copying code directly' "$d/Kbuild"; then
            sed -i 's/\$(error You should use \$(REPO_NAME) as a git submodule instead of copying code directly)/\$(warning You should use \$(REPO_NAME) as a git submodule instead of copying code directly)/' "$d/Kbuild"
            echo "Softened BakaSU submodule check in $d/Kbuild"
          fi
        done

    - name: Soften BakaSU susfs_compat gate for susfs-inline builds
      if: inputs.flavor == 'bakasu'
      shell: bash
      working-directory: ${{ github.workspace }}/kernel
      run: |
        # BakaSU's kernel/tools/susfs_compat.mk ends with an UNCONDITIONAL
        # $(error "Please wait susfs update.") that fires on every
        # CONFIG_KSU_SUSFS=y build (run 38221374132: the 6.1 BakaSU leg).
        # The file's real work - the grep-based KSU_COMPAT_HAS_* defines
        # above the gate - adapts the code to both old and new susfs
        # layouts, so the hard stop is overcautious for our builds. Strip
        # the tail (both $(info) lines and the $(error)), keep the shims.
        F="BakaSU/kernel/tools/susfs_compat.mk"
        if [ -f "$F" ] && grep -q 'Please wait susfs update' "$F"; then
          sed -i '/susfs has NOT update with latest KernelSU source/,$d' "$F"
          echo "Stripped susfs_compat hard stop from $F"
        else
          echo "No susfs_compat gate present; nothing to do"
        fi
