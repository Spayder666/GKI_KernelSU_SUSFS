name: Kernel Build Process
permissions:
  contents: write
  actions: write

on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      android_version:
        required: true
        type: string
      kernel_version:
        required: true
        type: string
      sublevel:
        required: true
        type: string
      os_patch_level:
        required: true
        type: string
      variant:
        required: false
        type: string
      feature_set:
        required: true
        type: string
      ksu_branch:
        required: false
        type: string
        default: ""
      susfs_commit:
        required: false
        type: string
        default: ""
      root_flavor:
        required: false
        type: string
        default: ""
      root_commit:
        required: false
        type: string
        default: ""
      nomount_commit:
        required: false
        type: string
        default: ""
      kernel_patches_commit:
        required: false
        type: string
        default: ""
      anykernel3_commit:
        required: false
        type: string
        default: ""
      droidspaces_commit:
        required: false
        type: string
        default: ""
      brand_name:
        required: false
        type: string
        default: Wild
      keep_kmi:
        required: false
        type: boolean
        default: false
      allow_version_mismatch:
        required: false
        type: boolean
        default: false
      use_cache:
        description: "Enable ccache/bazel cache (restore/save via release buckets)"
        required: false
        type: boolean
        default: true
      page_size:
        description: "ARM64 page size: 4k (default) or 16k (Kleaf --page_size)"
        required: false
        type: string
        default: "4k"
      stock_config_artifact:
        description: "Artifact name with prefetched stock configs (stock_<kver>[_16k].config)"
        required: false
        type: string
        default: ""

jobs:
  build-gki:
    name: "${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} (${{ inputs.variant }})"
    runs-on: ubuntu-latest
    timeout-minutes: 120
    concurrency:
      # Must include every input that varies across matrix legs. Without
      # sublevel/variant/page_size, several distinct builds collide on one key
      # and, with cancel-in-progress: false, queue behind each other instead of
      # running in parallel — one kernel compiles at a time.
      group: build-${{ inputs.root_flavor }}-${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size }}
      cancel-in-progress: false
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Download Prefetched Stock Configs
        if: inputs.stock_config_artifact != ''
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          name: ${{ inputs.stock_config_artifact }}
          path: stock-configs

      - name: Validate Page Size
        shell: bash
        run: |
          set -euo pipefail
          PAGE_SIZE="${{ inputs.page_size }}"
          case "$PAGE_SIZE" in
            4k) exit 0 ;;
            16k) ;;
            *) echo "ERROR: unsupported page_size '$PAGE_SIZE' (expected 4k or 16k)." >&2; exit 1 ;;
          esac
          # Kleaf exposes --page_size only on the build branches used by these
          # GKI families (main-kernel-build-2023/2024, main-kernel-2025).
          case "${{ inputs.version }}" in
            android14-6.1|android15-6.6|android16-6.12) ;;
            *)
              echo "ERROR: page_size=16k is not supported for ${{ inputs.version }}." >&2
              echo "Supported families: android14-6.1, android15-6.6, android16-6.12." >&2
              exit 1
              ;;
          esac

      - name: Emergency Disk Cleanup
        if: false
        uses: ./.github/actions/disk-cleanup

      - name: Free Disk Space
        if: true
        uses: endersonmenezes/free-disk-space@v4 # Use @main for latest, @v3 for stable
        with:
          remove_android: true
          remove_dotnet: true
          remove_haskell: true
          remove_tool_cache: true
          remove_swap: true
          remove_packages: "azure-cli google-cloud-cli microsoft-edge-stable google-chrome-stable firefox postgresql* temurin-* *llvm* mysql* dotnet-sdk-*"
          remove_packages_one_command: true
          remove_folders: "/usr/share/swift /usr/share/miniconda /usr/share/az* /usr/local/lib/node_modules /usr/local/share/chromium /usr/local/share/powershell /usr/local/julia /usr/local/aws-cli /usr/local/aws-sam-cli /usr/share/gradle"
          rm_cmd: "rmz" # Use 'rmz' for faster deletion (default: 'rm')
          rmz_version: "3.2.0" # Required when rm_cmd is 'rmz'
          testing: false

      - name: Setup more Swap (for LTO)
        uses: pierotofy/set-swap-space@master
        with:
          swap-size-gb: 16

      - name: Setup Build Environment
        uses: ./.github/actions/setup-build-environment
        with:
          version: ${{ inputs.version }}
          sublevel: ${{ inputs.sublevel }}
          kernel_patches_commit: ${{ inputs.kernel_patches_commit }}
          anykernel3_commit: ${{ inputs.anykernel3_commit }}

      - name: Download Kernel Repository
        uses: ./.github/actions/download-kernel
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Spoof /proc/config.gz With Stock Config
        uses: ./.github/actions/stock-config
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}
          stock_config_dir: stock-configs

      - name: Set Build Timestamp from Kernel Commit
        shell: bash
        run: |
          set -x
          # Hardcode the build timestamp to the 5th day of the patch level
          # at 04:20 UTC, using the existing timestamp formats expected by the build.
          OS_PATCH_LEVEL_INPUT="${{ inputs.os_patch_level }}"
          if [[ "$OS_PATCH_LEVEL_INPUT" == lts* ]]; then
            if [[ "$OS_PATCH_LEVEL_INPUT" =~ ^lts-([0-9]{2})$ ]]; then
              OS_PATCH_LEVEL_YM="$(date -u +%Y)-${BASH_REMATCH[1]}"
            else
              OS_PATCH_LEVEL_YM="$(date -u +%Y-%m)"
            fi
          else
            OS_PATCH_LEVEL_YM="$OS_PATCH_LEVEL_INPUT"
          fi
          FIXED_BUILD_DATE="${OS_PATCH_LEVEL_YM}-05 04:20:00 UTC"
          SOURCE_DATE_EPOCH=$(date -u -d "$FIXED_BUILD_DATE" +%s)
          echo "SOURCE_DATE_EPOCH=$SOURCE_DATE_EPOCH" >> $GITHUB_ENV
          KBUILD_TS=$(date -u -d @${SOURCE_DATE_EPOCH} '+%a %b %d %H:%M:%S UTC %Y')
          echo "KBUILD_BUILD_TIMESTAMP=${KBUILD_TS}" >> $GITHUB_ENV
          # Keep git metadata aligned with the same fixed timestamp.
          GIT_DATE=$(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%dT%H:%M:%SZ')
          echo "GIT_COMMITTER_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "GIT_AUTHOR_DATE=${GIT_DATE}" >> $GITHUB_ENV
          echo "Build timestamp set to: $(date -u -d @${SOURCE_DATE_EPOCH} '+%Y-%m-%d %H:%M:%S UTC') (epoch: $SOURCE_DATE_EPOCH)"

      - name: Extract Sublevel and Set File Name
        id: extract
        uses: ./.github/actions/extract-sublevel-file-name
        with:
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ inputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          variant: ${{ inputs.variant }}
          page_size: ${{ inputs.page_size }}

      - name: Kernel Fixes
        uses: ./.github/actions/kernel-fixes
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}

      - name: Reject KowSU with SUSFS
        if: inputs.root_flavor == 'kowsu' && (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All')
        shell: bash
        run: |
          echo "ERROR: KowSU does not work together with SUSFS — re-run with SUSFS off." >&2
          exit 1

      - name: Reject FinaSU without SUSFS
        # FinaSU's kernel hard-depends on the susfs headers and its supercall
        # dispatch references susfs symbols unguarded, so a susfs-less build
        # cannot link. Unlike KernelSU/BakaSU there is no susfs-free shape.
        if: inputs.root_flavor == 'finasu' && !contains(inputs.feature_set, 'SUSFS')
        shell: bash
        run: |
          echo "ERROR: FinaSU requires SUSFS — re-run with SUSFS on." >&2
          exit 1

      - name: Setup Selected Root Implementation
        if: inputs.root_flavor != '' && inputs.root_flavor != 'none'
        uses: ./.github/actions/root-setup
        with:
          flavor: ${{ inputs.root_flavor }}
          commit: ${{ inputs.root_commit }}

      - name: Mark No Root build metadata
        if: inputs.root_flavor == 'none'
        shell: bash
        run: |
          {
            echo "ROOT_IMPLEMENTATION=none"
            echo "ROOT_MANAGER=N/A"
            echo "ROOT_VERSION=N/A"
            echo "ROOT_COMMIT=N/A"
          } >> "$GITHUB_ENV"

      - name: Disable SUSFS for BakaSU without SUSFS feature
        if: inputs.root_flavor == 'bakasu' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: Disable SUSFS for SukiSU-Ultra without SUSFS feature
        if: inputs.root_flavor == 'sukisu-ultra' && !contains(inputs.feature_set, 'SUSFS')
        uses: ./.github/actions/set-kernel-config
        with:
          config_list: |
            CONFIG_KSU_SUSFS=n
            CONFIG_KSU_SUSFS_SUS_PATH=n
            CONFIG_KSU_SUSFS_SUS_MOUNT=n
            CONFIG_KSU_SUSFS_SUS_KSTAT=n
            CONFIG_KSU_SUSFS_SPOOF_UNAME=n
            CONFIG_KSU_SUSFS_ENABLE_LOG=n
            CONFIG_KSU_SUSFS_HIDE_KSU_SUSFS_SYMBOLS=n
            CONFIG_KSU_SUSFS_SPOOF_CMDLINE_OR_BOOTCONFIG=n
            CONFIG_KSU_SUSFS_OPEN_REDIRECT=n
            CONFIG_KSU_SUSFS_SUS_MAP=n

      - name: Resolve SUSFS commit
        id: susfs-cm
        shell: bash
        run: |
          set -euo pipefail
          # KernelSU-Next (next) always uses the latest susfs4ksu gki branch tip so
          # SUSFS stays API-matched to the always-latest KernelSU-Next tree. All
          # other roots (kernelsu, bakasu, finasu, sukisu-ultra) use the pinned
          # verified SUSFS commit.
          if [ "${{ inputs.root_flavor }}" = "next" ]; then
            BRANCH="gki-${{ inputs.android_version }}-${{ inputs.kernel_version }}"
            SUSFS_COMMIT="$(git ls-remote https://gitlab.com/simonpunk/susfs4ksu.git "refs/heads/${BRANCH}" | cut -f1)"
            echo "KernelSU-Next: resolving SUSFS at latest on ${BRANCH} -> ${SUSFS_COMMIT}"
          else
            SUSFS_COMMIT="${{ inputs.susfs_commit }}"
            echo "Using pinned SUSFS commit: ${SUSFS_COMMIT}"
          fi
          echo "commit=${SUSFS_COMMIT}" >> "$GITHUB_OUTPUT"

      - name: SUSFS
        if: contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All'
        uses: ./.github/actions/susfs
        with:
          susfs_commit: ${{ steps.susfs-cm.outputs.commit }}
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          os_patch_level: ${{ inputs.os_patch_level }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          root_flavor: ${{ inputs.root_flavor }}

      - name: Alias susfs_avc_spoof off the public default (post-susfs)
        if: >-
          (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All') &&
          inputs.root_flavor == 'next'
        shell: bash
        working-directory: ${{ github.workspace }}/kernel/KernelSU-Next
        run: |
          # The root-setup alias patch runs BEFORE this workflow's SUSFS step,
          # and the SUSFS action copies susfs4ksu's kernel/susfs/* over the
          # KernelSU-Next tree - clobbering the patched alias (run
          # 44295096533: root-setup logged "priv-app alias moved", the built
          # Image still carried the upstream literal). Re-apply AFTER SUSFS.
          # The alias lands verbatim in auditd lines and DChecker 1135 greps
          # app-readable auditd for the exact upstream literal
          # "u:r:priv_app:s0:c512,c768" reporting "Fake tcontext: priv_app
          # alias" + auditpatch runtime markers (lynx 2026-11-18).
          # system_app is an in-policy AOSP domain that resolves at init.
          python3 - <<'PY'
          import io
          p = "kernel/susfs/susfs_avc_spoof.c"
          s = io.open(p, encoding="utf-8").read()
          marker = "dc: priv-app alias off default"
          if marker in s:
              print("susfs_avc_spoof: alias already moved")
          elif 'static char avc_priv_app_ctx[128] = "u:r:priv_app:s0:c512,c768";' in s:
              new = (
                  "/* dc: priv-app alias off default. The alias lands verbatim in\n"
                  " * auditd lines and DChecker 1135 greps app-readable auditd for\n"
                  " * the exact upstream literal \"u:r:priv_app:s0:c512,c768\"\n"
                  " * reporting \"Fake tcontext: priv_app alias\" + auditpatch\n"
                  " * runtime markers (lynx 2026-11-18). system_app is an in-policy\n"
                  " * AOSP domain that resolves at init like priv_app did. */\n"
                  'static char avc_priv_app_ctx[128] = "u:r:system_app:s0";'
              )
              s = s.replace(
                  'static char avc_priv_app_ctx[128] = "u:r:priv_app:s0:c512,c768";',
                  new, 1)
              io.open(p, "w", encoding="utf-8", newline="\n").write(s)
              print("susfs_avc_spoof: priv-app alias moved off the public default")
          else:
              raise SystemExit("susfs_avc_spoof: upstream alias default not found")
          PY
          # kernel/extras.c carries the SECOND built-in avc spoof (ksu
          # security hook, always compiled) with the same upstream literal -
          # patch it too, same alias.
          python3 - <<'PY2'
          import io
          p2 = "kernel/extras.c"
          s2 = io.open(p2, encoding="utf-8").read()
          if "dc: extras alias moved" in s2:
              print("extras.c: alias already moved")
          elif 'ksu_security_secctx_to_secid("u:r:priv_app:s0:c512,c768"' in s2:
              s2 = s2.replace(
                  'ksu_security_secctx_to_secid("u:r:priv_app:s0:c512,c768"',
                  '/* dc: extras alias moved */ ksu_security_secctx_to_secid("u:r:system_app:s0"',
                  1)
              s2 = s2.replace(
                  '"u:r:priv_app:s0:c512,c768", strlen("u:r:priv_app:s0:c512,c768"',
                  '"u:r:system_app:s0", strlen("u:r:system_app:s0"',
                  1)
              io.open(p2, "w", encoding="utf-8").write(s2)
              print("extras.c: priv-app alias moved off the public default")
          else:
              print("extras.c: no upstream literal - skip")
          PY2

      - name: Hide added SELinux types from app context parses (post-susfs, next)
        if: >-
          (contains(inputs.feature_set, 'SUSFS') || inputs.feature_set == 'All') &&
          inputs.root_flavor == 'next'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          # App-uid SELinux context queries (/proc/*/attr/current,
          # /sys/fs/selinux/context, /sys/fs/selinux/access) go through the
          # susfs copies of the stock handlers. Those parse the LIVE policy
          # and reject a type KernelSU added only after finding it:
          #   symtab_search hit -> typdatum->value -> susfs_is_sus_type_rcu()
          # The datum and the susfs hash line are a cold cache line each, so
          # a hidden type costs 27..60 ns more than a name that does not
          # exist (Duck 1118 "ksu_types timing", Pixel 6a 2026-11-23:
          # u:object_r:ksu_file:s0 slower in 98% of pairs).
          #
          # Answering the same nodes from the backup policy closes that
          # channel and opens the opposite one: those tables are cold, the
          # name-dependent chain walks inflate to hundreds of ns and KSU
          # names came out FASTER than invalid ones (A<B 10945/13500).
          #
          # So keep the live (warm) parse and make an added type a plain
          # miss, decided on the NAME the lookup has just compared (hot
          # line). The decision itself has to be free: an out-of-line
          # strcmp() check still left the hidden name 40..120 ns slower, a
          # leaf byte loop 20..35 ns. Hence the registry lives in this file
          # and the check is __always_inline: a byte walk, no call, no
          # extra line, no datum read. KSU names then cost what they cost
          # on a stock kernel, where they were never in the table.
          #
          # Second change, same handler: a leading-newline context skips
          # the parse, which is cheaper than any parsed context. Run it
          # through the same parse as the context it wraps (first byte read
          # as 'u') before the stock skip path; the verdict is unchanged.
          # DChecker's "App Zygote attr/current timing" signs that pair and
          # flipped Danger/Clear on +-1 tick around zero.
          python3 - <<'PY'
          import io

          MARK = "dc: added SELinux types"

          def load(p):
              return io.open(p, encoding="utf-8").read()

          def save(p, s):
              io.open(p, "w", encoding="utf-8", newline="\n").write(s)

          def once(s, old, new, label):
              if s.count(old) != 1:
                  raise SystemExit("%s: anchor count %d" % (label, s.count(old)))
              return s.replace(old, new)

          # --- KernelSU-Next: report every type it adds ----------------------
          p = "kernel/KernelSU-Next/kernel/selinux/sepolicy.c"
          s = load(p)
          if MARK in s:
              print(p + ": already patched")
          else:
              s = once(
                  s,
                  "bool ksu_type(struct policydb *db, const char *name, const char *attr)\n"
                  "{\n"
                  "    return add_type(db, name, false) && add_typeattribute(db, name, attr);\n"
                  "}\n",
                  "/* dc: added SELinux types. The app-uid SELinux context parse treats\n"
                  " * a type KernelSU added as unknown; the registry of those names\n"
                  " * lives next to that parse (security/selinux/ss/services.c), so\n"
                  " * that its check can be inlined. */\n"
                  "extern void ksu_note_added_type(const char *name);\n"
                  "\n"
                  "bool ksu_type(struct policydb *db, const char *name, const char *attr)\n"
                  "{\n"
                  "    if (!add_type(db, name, false) || !add_typeattribute(db, name, attr))\n"
                  "        return false;\n"
                  "    ksu_note_added_type(name);\n"
                  "    return true;\n"
                  "}\n",
                  "ksu_type")
              save(p, s)
              print(p + ": ksu_type reports added types")

          # --- susfs parse: added type = plain miss, free decision -----------
          p = "kernel/common/security/selinux/ss/services.c"
          s = load(p)
          if MARK in s:
              print(p + ": already patched")
          else:
              s = once(
                  s,
                  "static int susfs_string_to_context_struct(struct policydb *pol,\n",
                  "/* dc: added SELinux types. Names of the types KernelSU added to the\n"
                  " * policy (ksu_note_added_type, called from ksu_type). The app-uid\n"
                  " * parse below treats them as unknown, and that decision has to\n"
                  " * cost what a lookup miss costs: no datum read (a cold line per\n"
                  " * hidden type), no strcmp() call, no call at all. Each of those\n"
                  " * left a hidden name 20..120 ns slower than an unknown name -\n"
                  " * the \"ksu_types timing\" oracle (Duck 1118, 2026-11-23). */\n"
                  "#define DC_ADDED_TYPES_MAX 8\n"
                  "#define DC_ADDED_TYPES_NAME 16\n"
                  "static char dc_added_types[DC_ADDED_TYPES_MAX][DC_ADDED_TYPES_NAME];\n"
                  "static u32 dc_added_types_n;\n"
                  "\n"
                  "void ksu_note_added_type(const char *name)\n"
                  "{\n"
                  "\tconst char *e;\n"
                  "\tu32 i, j, n;\n"
                  "\n"
                  "\tif (!name || !name[0])\n"
                  "\t\treturn;\n"
                  "\tn = READ_ONCE(dc_added_types_n);\n"
                  "\tfor (i = 0; i < n; i++) {\n"
                  "\t\te = dc_added_types[i];\n"
                  "\t\tfor (j = 0; j < DC_ADDED_TYPES_NAME - 1 && name[j] &&\n"
                  "\t\t     name[j] == e[j]; j++)\n"
                  "\t\t\t;\n"
                  "\t\tif (j == DC_ADDED_TYPES_NAME - 1 || !name[j])\n"
                  "\t\t\treturn;\n"
                  "\t}\n"
                  "\tif (n >= DC_ADDED_TYPES_MAX)\n"
                  "\t\treturn;\n"
                  "\tfor (j = 0; j < DC_ADDED_TYPES_NAME - 1 && name[j]; j++)\n"
                  "\t\tdc_added_types[n][j] = name[j];\n"
                  "\tdc_added_types[n][j] = '\\0';\n"
                  "\tWRITE_ONCE(dc_added_types_n, n + 1);\n"
                  "}\n"
                  "\n"
                  "static __always_inline bool dc_type_name_is_added(const char *name)\n"
                  "{\n"
                  "\tconst char *e, *k;\n"
                  "\tu32 i, n = READ_ONCE(dc_added_types_n);\n"
                  "\n"
                  "\tfor (i = 0; i < n; i++) {\n"
                  "\t\te = dc_added_types[i];\n"
                  "\t\tk = name;\n"
                  "\t\twhile (*e && *k == *e) {\n"
                  "\t\t\tk++;\n"
                  "\t\t\te++;\n"
                  "\t\t}\n"
                  "\t\tif (!*e)\n"
                  "\t\t\treturn true;\n"
                  "\t}\n"
                  "\treturn false;\n"
                  "}\n"
                  "\n"
                  "static int susfs_string_to_context_struct(struct policydb *pol,\n",
                  "registry placement")
              s = once(
                  s,
                  "\tif (typdatum && !typdatum->attribute) {\n"
                  "\t\tif (likely(susfs_is_sus_type_rcu(typdatum->value)))\n"
                  "\t\t\tgoto out;\n"
                  "\t\tgoto orig_flow;\n"
                  "\t}\n",
                  "\t/* dc: added SELinux types are unknown to app uids, decided on\n"
                  "\t * the name the lookup has just compared (hot line). */\n"
                  "\tif (typdatum && __builtin_expect(dc_type_name_is_added(scontextp), 0))\n"
                  "\t\tgoto out;\n"
                  "\tif (typdatum && !typdatum->attribute)\n"
                  "\t\tgoto orig_flow;\n",
                  "susfs type check")
              save(p, s)
              print(p + ": added types answer as unknown for app uids")

          # --- susfs setprocattr: newline class pays the wrapped parse -------
          p = "kernel/common/security/selinux/hooks.c"
          s = load(p)
          if MARK in s:
              print(p + ": already patched")
          else:
              fn = s.find("static int susfs_selinux_setprocattr(")
              if fn < 0 or s.count("static int susfs_selinux_setprocattr(") != 1:
                  raise SystemExit("susfs setprocattr anchor missing")
              comment = "\t/* Obtain a SID for the context, if one was specified. */\n"
              at = s.find(comment, fn)
              if at < 0:
                  raise SystemExit("susfs setprocattr: SID comment not found")
              gate = (
                  "\t/* dc: added SELinux types, newline class. A leading-newline\n"
                  "\t * context skips the parse below, which makes it cheaper than\n"
                  "\t * any parsed context. Run it through the same parse as the\n"
                  "\t * context it wraps (first byte read as 'u') before the stock\n"
                  "\t * skip path. The verdict is unchanged: sid stays 0. */\n"
                  "\tif (size && str[0] == '\\n') {\n"
                  "\t\tu32 dc_len = size;\n"
                  "\n"
                  "\t\tif (str[dc_len - 1] == '\\n')\n"
                  "\t\t\tdc_len--;\n"
                  "\t\tif (dc_len) {\n"
                  "\t\t\tstr[0] = 'u';\n"
                  "\t\t\tsusfs_security_context_to_sid(&selinux_state, str,\n"
                  "\t\t\t\t\t\t      dc_len, &sid, GFP_KERNEL);\n"
                  "\t\t\tstr[0] = '\\n';\n"
                  "\t\t\tsid = 0;\n"
                  "\t\t}\n"
                  "\t}\n"
                  "\n"
              )
              s = s[:at] + gate + s[at:]
              save(p, s)
              print(p + ": newline class pays the wrapped parse")
          PY

      - name: Fix selinux_hide pointer-bool-conversion on 6.6+ (ALL branches)
        shell: bash
        run: |
          set -euo pipefail
          KVER="${{ inputs.kernel_version }}"
          if [ "$(printf '%s\n' "6.6" "$KVER" | sort -V | head -n1)" = "6.6" ]; then
            echo "[*] KVER $KVER >= 6.6, patching selinux_hide.c (all flavors/branches)"
            while IFS= read -r f; do
              # After SUSFS 10_enable (kernelsu only) the declaration becomes
              #   extern void security_dump_masked_av_fn(...)   (a function)
              #   if (func) / if (func != NULL) both trigger -Werror:
              #     -Wpointer-bool-conversion  vs  -Wtautological-pointer-compare
              # For the function form,  &func != NULL  silences both (clang note).
              # For the pointer form (bakasu/next/sukisu-ultra/finasu, no 10_enable) we want ptr != NULL.
              if grep -q "extern void security_dump_masked_av_fn" "$f"; then
                echo "[*] $f is extern-function form (10_enable applied), patching with &"
                sed -i 's/if (security_dump_masked_av_fn)/if (\&security_dump_masked_av_fn)/g' "$f"
                sed -i 's/if (security_dump_masked_av_fn != NULL)/if (\&security_dump_masked_av_fn != NULL)/g' "$f"
                sed -i 's/if (context_struct_compute_av_fn)/if (\&context_struct_compute_av_fn)/g' "$f"
                sed -i 's/if (context_struct_compute_av_fn != NULL)/if (\&context_struct_compute_av_fn != NULL)/g' "$f"
                echo "[+] Patched $f (function form)"
              elif grep -q "if (security_dump_masked_av_fn" "$f"; then
                echo "[*] $f is pointer form, patching with != NULL"
                sed -i 's/if (security_dump_masked_av_fn)/if (security_dump_masked_av_fn != NULL)/g' "$f"
                sed -i 's/if (context_struct_compute_av_fn)/if (context_struct_compute_av_fn != NULL)/g' "$f"
                echo "[+] Patched $f (pointer form)"
              else
                echo "[*] $f already patched"
              fi
              # Next (and tiann without 10_enable fallback) declares the 3 helpers as
              # static on 6.6, but kernel hooks.c/selinuxfs.c reference them as extern
              # after SUSFS (BakaSU uses __maybe_static -> global). Strip static so
              # the linker can resolve security_context_to_sid_with_policy etc.
              if grep -q "^static int security_context_to_sid_with_policy" "$f"; then
                echo "[*] Stripping static from $f helpers (Next 6.6)"
                sed -i 's/^static int security_context_to_sid_with_policy/int security_context_to_sid_with_policy/g' "$f"
                sed -i 's/^static int security_sid_to_context_with_policy/int security_sid_to_context_with_policy/g' "$f"
                sed -i 's/^static void security_compute_av_user_with_policy/void security_compute_av_user_with_policy/g' "$f"
                # also forward decls (same prefix, same sed covers them)
                echo "[+] Stripped static from $f"
              fi
            done
          else
            echo "[-] KVER $KVER < 6.6"
          fi

      - name: Baseband Guard
        if: (contains(inputs.feature_set, 'BBG') || inputs.feature_set == 'All')
        uses: ./.github/actions/bbg

      - name: Setup Networking
        if: contains(inputs.feature_set, 'NET') || inputs.feature_set == 'All'
        uses: ./.github/actions/networking
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: DroidSpaces-OSS Patches
        if: contains(inputs.feature_set, 'DS') || inputs.feature_set == 'All'
        uses: ./.github/actions/droidspaces
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          os_patch_level: ${{ inputs.os_patch_level }}
          droidspaces_commit: ${{ inputs.droidspaces_commit }}

      - name: Apply NTSync Patches
        if: contains(inputs.feature_set, 'NTSync')
        uses: ./.github/actions/ntsync
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Ptrace Patch
        if: contains(inputs.feature_set, 'Ptrace')
        uses: ./.github/actions/ptrace
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Unicode Fix Patch
        if: contains(inputs.feature_set, 'Unicode')
        uses: ./.github/actions/unicode-fix
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Performance Patches
        uses: ./.github/actions/performance
        if: contains(inputs.feature_set, 'Perf')
        with:
          kernel_version: ${{ inputs.kernel_version }}

      - name: Setup Misc Configs
        uses: ./.github/actions/misc
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          variant: ${{ inputs.variant }}

      - name: Enable BPF Stack (BTF + eBPF + FUSE-BPF)
        if: contains(inputs.feature_set, 'BPF')
        uses: ./.github/actions/btf
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Apply Device-Specific Patches
        uses: ./.github/actions/apply-device-patches
        with:
          version: ${{ inputs.version }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Integrate NoMount
        if: contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All'
        uses: ./.github/actions/nomount
        with:
          commit: ${{ inputs.nomount_commit }}
          kernel_version: ${{ inputs.kernel_version }}

      - name: Apply Kernel Branding
        uses: ./.github/actions/apply-kernel-branding
        with:
          variant: ${{ inputs.variant }}
          kernel_version: ${{ inputs.kernel_version }}
          android_version: ${{ inputs.android_version }}
          version: ${{ inputs.version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}
          brand_name: ${{ inputs.brand_name }}
          keep_kmi: ${{ inputs.keep_kmi }}

      - name: Remove Protected Exports
        uses: ./.github/actions/remove-protected-exports

      - name: Clean Kernel Flags
        uses: ./.github/actions/clean-kernel-flags

      - name: Scan and collect patch rejects
        id: scan
        if: always()
        uses: ./.github/actions/scan-patch-rejects

      - name: Upload Rejects
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-Rejects
          path: patch-rejects/
          if-no-files-found: ignore
          compression-level: 9

      - name: "Setup Cache and Build Environment"
        if: inputs.use_cache
        uses: ./.github/actions/cache-setup
        with:
          version: ${{ inputs.version }}
          android_version: ${{ inputs.android_version }}
          kernel_version: ${{ inputs.kernel_version }}
          sublevel: ${{ steps.extract.outputs.sublevel }}

      - name: Restore ccache
        id: restore-ccache
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: ccache-cache-${{ inputs.version }}-${{ inputs.variant }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Restore bazel-cache
        id: restore-bazel
        continue-on-error: true
        if: inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        uses: ./.github/actions/cache-restore
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          restore_keys: |
            ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-

      - name: Check cache hit
        run: |
          echo "Cache restore status:"
          CCACHE_HIT="${{ steps.restore-ccache.outputs.cache-hit || 'skipped' }}"
          BAZEL_HIT="${{ steps.restore-bazel.outputs.cache-hit || 'skipped' }}"
          echo "  ccache: $CCACHE_HIT"
          echo "  bazel: $BAZEL_HIT"

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: true

      - name: Initialize Config Fragment
        run: touch "${{ github.workspace }}/wild_gki.fragment"

      - name: Apply Kernel Bypass Hack
        if: ${{ inputs.allow_version_mismatch == 'true' }}
        uses: ./.github/actions/bypass-kernel
        with:
          version: ${{ inputs.version }}
          allow_version_mismatch: true

      - name: Build Normal Kernel
        env:
          SOURCE_DATE_EPOCH: ${{ env.SOURCE_DATE_EPOCH }}
          KBUILD_BUILD_TIMESTAMP: ${{ env.KBUILD_BUILD_TIMESTAMP }}
          KBUILD_BUILD_USER: ${{ (inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12') && 'kleaf' || 'build-user' }}
          KBUILD_BUILD_HOST: build-host
        uses: ./.github/actions/build-kernel
        with:
          version: ${{ inputs.version }}
          page_size: ${{ inputs.page_size }}

      - name: Get Cache Stats
        uses: ./.github/actions/cache-stats
        with:
          clear_stats: false

      - name: Prune ccache before save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        shell: bash
        run: |
          if [ -d /home/runner/.ccache ]; then
            ccache -c 2>/dev/null || true
            find /home/runner/.ccache -type f -mtime +0.5 -delete 2>/dev/null || true
            find /home/runner/.ccache -type d -empty -delete 2>/dev/null || true
            echo "ccache pruned"; ccache -s 2>/dev/null | head -20 || true
          fi

      - name: Save ccache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android12-5.10' || inputs.version == 'android13-5.10' || inputs.version == 'android13-5.15')
        with:
          cache_path: /home/runner/.ccache
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}
          cache_bucket: "ccache-cache-${{ inputs.version }}-${{ inputs.variant }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Save bazel-cache
        continue-on-error: true
        uses: ./.github/actions/cache-save
        if: always() && inputs.use_cache && (inputs.version == 'android14-5.15' || inputs.version == 'android14-6.1' || inputs.version == 'android15-6.6' || inputs.version == 'android16-6.12')
        with:
          cache_path: /home/runner/.cache/bazel
          cache_key: ${{ inputs.android_version }}-${{ inputs.kernel_version }}.${{ steps.extract.outputs.sublevel }}-${{ inputs.os_patch_level }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}
          cache_bucket: "bazel-cache-${{ inputs.version }}-${{ inputs.variant }}${{ inputs.page_size == '16k' && '-16k' || '' }}"
          compression_level: 9
          github_token: ${{ github.token }}

      - name: Consolidated Build Summary
        if: always()
        shell: bash
        run: |
          SUMMARY_BASE="${{ steps.extract.outputs.file_name }}"
          if [ -z "${SUMMARY_BASE}" ]; then
            SUMMARY_BASE="${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }}"
            VARIANT="${{ inputs.variant }}"
            if [ -n "${VARIANT}" ] && [ "${VARIANT}" != "Normal" ]; then
              SUMMARY_BASE="${SUMMARY_BASE}-${VARIANT}"
            fi
            if [ "${{ inputs.page_size }}" = "16k" ]; then
              SUMMARY_BASE="${SUMMARY_BASE}-16k"
            fi
          fi
          SUMMARY_FILE="/tmp/build-summary-${SUMMARY_BASE}.md"
          echo "SUMMARY_BASE=${SUMMARY_BASE}" >> "$GITHUB_ENV"

          # NoMount is optional (nomount_commit input is always populated, so
          # feature_set is the only reliable signal for whether it was built).
          NOMOUNT_ENABLED="false"
          if [ "${{ contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All' }}" = "true" ]; then
            NOMOUNT_ENABLED="true"
          fi

          # Determine build status
          if [ "${{ job.status }}" = "success" ]; then
            STATUS="[+] Success"
          else
            STATUS="[-] Failed"
          fi

          # Get kernel version from Image if available
          KERNEL_VER_STR=""
          if [ -f "/home/runner/out/dist/Image" ]; then
            KERNEL_VER_STR=$(strings "/home/runner/out/dist/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
          elif [ -f "/home/runner/out/Image" ]; then
            KERNEL_VER_STR=$(strings "/home/runner/out/Image" | grep -m1 "^Linux version " | sed 's/Linux version //' || echo "")
          fi

          # Get KSU version from env (set by kernelsu action)
          KSU_VER="${KSU_VERSION:-N/A}"
          KSU_TAG="${KSU_GIT_TAG:-N/A}"
          ROOT_IMPL="${ROOT_IMPLEMENTATION:-KernelSU-Next (legacy path)}"
          ROOT_MANAGER="${ROOT_MANAGER:-KernelSU-Next Manager}"
          ROOT_VERSION="${ROOT_VERSION:-${KSU_TAG}}"
          ROOT_SHA="${ROOT_COMMIT:-${KSU_COMMIT:-N/A}}"
          if [ "$NOMOUNT_ENABLED" = "true" ]; then
            NOMOUNT_SHA="${NOMOUNT_COMMIT:-${{ inputs.nomount_commit }}}"
          else
            NOMOUNT_SHA="N/A"
          fi
          SUSFS_SHA="${SUSFS_COMMIT:-${{ inputs.susfs_commit }}}"

          # Get SUSFS version from susfs.h if available
          SUSFS_VER="N/A"
          if [ -f "${{ github.workspace }}/kernel/common/include/linux/susfs.h" ]; then
            SUSFS_VER=$(grep '#define SUSFS_VERSION' "${{ github.workspace }}/kernel/common/include/linux/susfs.h" | awk -F'"' '{print $2}' || echo "N/A")
          fi

          {
            echo "## ${{ inputs.android_version }} ${{ inputs.kernel_version }}.${{ inputs.sublevel }} (${{ inputs.variant }}) - ${STATUS}"
            echo
            echo "| Metric | Value |"
            echo "|--------|-------|"
            echo "| **Status** | ${STATUS} |"
            echo "| **Kernel** | ${{ inputs.kernel_version }}.${{ inputs.sublevel }}-${{ inputs.android_version }}-${{ inputs.os_patch_level }} |"
            if [ -n "$KERNEL_VER_STR" ]; then
              echo "| **Version String** | \`${KERNEL_VER_STR}\` |"
            fi
            echo "| **KSU Version** | ${KSU_VER} |"
            echo "| **KSU Tag** | ${KSU_TAG} |"
            echo "| **Root Implementation** | ${ROOT_IMPL} |"
            echo "| **Root Manager** | ${ROOT_MANAGER} |"
            echo "| **Root Version** | ${ROOT_VERSION} |"
            echo "| **Root Commit** | ${ROOT_SHA} |"
            echo "| **SUSFS Version** | ${SUSFS_VER} |"
            echo "| **SUSFS Commit** | ${SUSFS_SHA} |"
            echo "| **NoMount Commit** | ${NOMOUNT_SHA} |"
            echo "| **Feature Set** | ${{ inputs.feature_set }} |"
            echo "| **Variant** | ${{ inputs.variant }} |"
            echo "| **Page Size** | ${{ inputs.page_size }} |"
            echo
            
            # Kernel Fixes
            if [ -f /tmp/kernel-fixes-summary.md ]; then
              echo "### Kernel Fixes"
              cat /tmp/kernel-fixes-summary.md
              echo
            fi
          } > "$SUMMARY_FILE"

      - name: Upload Artifacts
        id: kernel-artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-AnyKernel3
          path: ${{ github.workspace }}/AnyKernel3/**
          if-no-files-found: ignore
          compression-level: 9

      - name: Write Build-verified only artifact metadata
        if: success() && inputs.root_flavor != '' && inputs.root_flavor != 'none'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # NoMount is optional: only resolve its artifact when requested.
          # (nomount_commit input is always populated, so feature_set is the
          # only reliable signal for whether NoMount was integrated.)
          NOMOUNT_ENABLED="false"
          if [ "${{ contains(inputs.feature_set, 'NoMount') || inputs.feature_set == 'All' }}" = "true" ]; then
            NOMOUNT_ENABLED="true"
          fi

          if [ "$NOMOUNT_ENABLED" = "true" ]; then
            METHOD="GKI source build with SHA-pinned root implementation, SUSFS, and NoMount"
            NOMOUNT_MODULE_COMMIT="${{ inputs.nomount_commit }}"
          else
            METHOD="GKI source build with SHA-pinned root implementation and SUSFS"
            NOMOUNT_MODULE_COMMIT="N/A"
          fi

          metadata_file="/tmp/${SUMMARY_BASE}-metadata.json"
          summary_file="/tmp/build-summary-${SUMMARY_BASE}.md"
          artifacts_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100"

          resolve_artifact() {
            local artifact_name="$1"
            local page=1
            local match=""
            local page_file
            local attempt
            page_file="$(mktemp)"

            # GitHub indexes an artifact asynchronously: the upload step can
            # report "successfully finalized" and still not have the artifact in
            # the run's list for a second or two. Retry the whole lookup before
            # calling it missing, otherwise a just-uploaded artifact reads as
            # absent and fails the step.
            for attempt in 1 2 3 4 5 6; do
              page=1
              match=""

              # Page through the artifacts API, checking each page for the exact
              # artifact name. Uses a temp file for jq input (not argv) so large
              # artifact lists can't exceed the OS argument-length limit.
              while :; do
                curl --fail --silent --show-error --location \
                  --retry 5 --retry-delay 3 --retry-all-errors --connect-timeout 30 \
                  --header "Authorization: Bearer ${GH_TOKEN}" \
                  --header "X-GitHub-Api-Version: 2022-11-28" \
                  "${artifacts_api}&page=${page}" -o "$page_file"

                match="$(jq -r --arg name "$artifact_name" \
                  '[.artifacts[] | select(.name == $name and .expired == false)] | .[0]
                   | if . == null then "" else (.archive_download_url + "\t" + .digest) end' \
                  "$page_file")"

                items="$(jq '(.artifacts | length) // 0' "$page_file")"
                if [ "$items" -lt 100 ] || [ -n "$match" ]; then
                  break
                fi
                page=$((page + 1))
              done

              if [ -n "$match" ]; then
                break
              fi
              echo "  artifact '$artifact_name' not listed yet (attempt ${attempt}/6); re-querying in 10s" >&2
              sleep 10
            done

            rm -f "$page_file"
            if [ -z "$match" ]; then
              echo "Expected exactly one available artifact named ${artifact_name}." >&2
              exit 1
            fi
            printf '%s\n' "$match"
          }

          read -r kernel_artifact_url kernel_artifact_sha256 < <(
            resolve_artifact "${{ steps.extract.outputs.file_name }}-AnyKernel3"
          )
          if [ "$NOMOUNT_ENABLED" = "true" ]; then
            read -r nomount_module_url nomount_module_sha256 < <(
              resolve_artifact "NoMount-Metamodule"
            )
          else
            nomount_module_url="N/A"
            nomount_module_sha256="N/A"
          fi

          jq -n \
            --arg method "$METHOD" \
            --arg root_implementation "${ROOT_IMPLEMENTATION:-KernelSU-Next (legacy path)}" \
            --arg root_manager "${ROOT_MANAGER:-KernelSU-Next Manager}" \
            --arg root_version "${ROOT_VERSION:-${KSU_GIT_TAG:-N/A}}" \
            --arg root_commit "${ROOT_COMMIT:-${KSU_COMMIT:-N/A}}" \
            --arg susfs_commit "${SUSFS_COMMIT:-N/A}" \
            --arg nomount_commit "${NOMOUNT_COMMIT:-N/A}" \
            --arg android_branch "${{ inputs.android_version }}-${{ inputs.kernel_version }}-${{ inputs.os_patch_level }}" \
            --arg kmi "${{ inputs.android_version }}-${{ inputs.kernel_version }}" \
            --arg page_size "${{ inputs.page_size }}" \
            --arg kernel_source_commit "${KERNEL_SOURCE_COMMIT:-N/A}" \
            --arg provenance_url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --arg artifact_url "$kernel_artifact_url" \
            --arg sha256 "$kernel_artifact_sha256" \
            --arg nomount_module_commit "$NOMOUNT_MODULE_COMMIT" \
            --arg nomount_module_url "$nomount_module_url" \
            --arg nomount_module_sha256 "$nomount_module_sha256" \
            --arg status "Build-verified only" \
            --arg catalog_availability "eligible-with-provenance-and-checksums" \
            --arg device_compatibility "not-validated" \
            --arg flashability "not-guaranteed" \
            --arg boot "not-guaranteed" \
            '{
              method: $method,
              root: {
                implementation: $root_implementation,
                manager: $root_manager,
                version: $root_version,
                commit: $root_commit
              },
              susfs_revision: $susfs_commit,
              nomount_commit: $nomount_commit,
              android_branch: $android_branch,
              kmi: $kmi,
              page_size: $page_size,
              kernel_source_commit: $kernel_source_commit,
              provenance_url: $provenance_url,
              artifact_url: $artifact_url,
              sha256: $sha256,
              nomount_metamodule: {
                commit: $nomount_module_commit,
                artifact_url: $nomount_module_url,
                sha256: $nomount_module_sha256
              },
              catalog: {
                availability: $catalog_availability,
                device_compatibility: $device_compatibility,
                flashability: $flashability,
                boot: $boot
              },
              status: $status
            }' > "$metadata_file"

          jq -e '
            .status == "Build-verified only" and
            (.root.manager | length > 0) and
            (.root.version | length > 0) and
            (.susfs_revision | test("^[0-9a-f]{40}$")) and
            (.kernel_source_commit | test("^[0-9a-f]{40}$")) and
            (.artifact_url | startswith("https://")) and
            (.sha256 | test("^sha256:[0-9a-f]{64}$")) and
            .catalog.availability == "eligible-with-provenance-and-checksums" and
            .catalog.device_compatibility == "not-validated" and
            .catalog.flashability == "not-guaranteed" and
            .catalog.boot == "not-guaranteed"
          ' "$metadata_file" > /dev/null
          if [ "$NOMOUNT_ENABLED" = "true" ]; then
            jq -e '
              (.nomount_commit | test("^[0-9a-f]{40}$")) and
              (.nomount_metamodule.commit == .nomount_commit) and
              (.nomount_metamodule.artifact_url | startswith("https://")) and
              (.nomount_metamodule.sha256 | test("^sha256:[0-9a-f]{64}$"))
            ' "$metadata_file" > /dev/null
          else
            jq -e '
              (.nomount_commit == "N/A") and
              (.nomount_metamodule.commit == "N/A") and
              (.nomount_metamodule.artifact_url == "N/A") and
              (.nomount_metamodule.sha256 == "N/A")
            ' "$metadata_file" > /dev/null
          fi

          # Merge the verified metadata into the combined summary markdown so both
          # live in a single artifact: human-readable table + machine JSON block.
          {
            echo
            echo "## Verified Metadata"
            echo
            echo '```json'
            cat "$metadata_file"
            echo '```'
            echo
          } >> "$summary_file"

      - name: Upload Build Summary + Metadata
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.extract.outputs.file_name }}-BuildInfo
          path: /tmp/build-summary-${{ env.SUMMARY_BASE }}.md
          if-no-files-found: warn
          compression-level: 9
